<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Деталі про гру</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      padding: 2rem;
      border-radius: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 1.5rem;
    }

    .info {
      margin-bottom: 1rem;
    }

    .label {
      font-weight: 600;
      color: #4b5563;
    }

    .value {
      font-size: 1.125rem;
      color: #1f2937;
    }

    a.link {
      display: inline-block;
      margin-top: 1.5rem;
      background-color: #3b82f6;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    a.link:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Деталі про гру</h1>
    <div class="info">
      <div class="label">Назва:</div>
      <div class="value">{{ game.name }}</div>
    </div>
    <div class="info">
      <div class="label">Ціна:</div>
      <div class="value">{{ game.price }}</div>
    </div>
    <div class="info">
      <div class="label">Опис:</div>
      <div class="value">{{ game.descriptions }}</div>
    </div>
    <div class="info">
      <div class="label">Посилання:</div>
      <div class="value"><a href="{{ game.link }}" target="_blank">{{ game.link }}</a></div>
    </div>
    <a class="link" href="{% url 'list' %}">← Назад до списку</a>
  </div>
</body>
</html>
